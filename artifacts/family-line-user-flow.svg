<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">Family Line user flow</title><desc id="desc">Family members share and confirm household information. Older relatives call for step-by-step help. Calls record outcomes and requests, and family follow-up notes inform future calls.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#698879" stroke-width="1.7"/></marker></defs><rect width="1600" height="1120" fill="#f7f8f3"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="48" font-size="18" fill="#285448" font-weight="700">FAMILY LINE</text><text x="48" y="97" font-size="35" fill="#203e36" font-weight="600">Everyday help, with context that carries forward.</text><text x="48" y="134" font-size="19" fill="#29483c" font-weight="400">Family members share what they know. A familiar phone call turns that context into help.</text><rect x="24" y="170" width="1552" height="210" rx="18" fill="#edf2e9"/><rect x="24" y="425" width="1552" height="260" rx="18" fill="#edf2e9"/><rect x="24" y="765" width="1552" height="200" rx="18" fill="#edf2e9"/><text x="48" y="222" font-size="14" fill="#3e6552" font-weight="400">FAMILY</text><text x="48" y="245" font-size="14" fill="#3e6552" font-weight="400">MEMBER</text><text x="48" y="285" font-size="15" fill="#64796d" font-weight="400">Web</text><text x="48" y="312" font-size="15" fill="#64796d" font-weight="400">conversation</text><text x="48" y="480" font-size="14" fill="#3e6552" font-weight="400">OLDER</text><text x="48" y="503" font-size="14" fill="#3e6552" font-weight="400">RELATIVE</text><text x="48" y="543" font-size="15" fill="#64796d" font-weight="400">A familiar</text><text x="48" y="570" font-size="15" fill="#64796d" font-weight="400">phone call</text><text x="48" y="818" font-size="14" fill="#3e6552" font-weight="400">FAMILY</text><text x="48" y="841" font-size="14" fill="#3e6552" font-weight="400">FOLLOW-UP</text><text x="48" y="881" font-size="15" fill="#64796d" font-weight="400">See the context.</text><text x="48" y="908" font-size="15" fill="#64796d" font-weight="400">Pick it up.</text><rect x="488.8" y="273.8" width="60.0" height="2.4" fill="#698879"/><polygon points="550.0,275.0 539.0,269.0 539.0,281.0" fill="#698879"/><rect x="848.8" y="273.8" width="180.0" height="2.4" fill="#698879"/><polygon points="1030.0,275.0 1019.0,269.0 1019.0,281.0" fill="#698879"/><text x="889" y="261" font-size="16" fill="#29483c" font-weight="400">confirmed</text><rect x="1238.8" y="368.8" width="2.4" height="32.0" fill="#698879"/><rect x="703.8" y="400.8" width="535.0" height="2.4" fill="#698879"/><rect x="703.8" y="400.8" width="2.4" height="43.0" fill="#698879"/><polygon points="705.0,445.0 711.0,434.0 699.0,434.0" fill="#698879"/><text x="849" y="392" font-size="16" fill="#29483c" font-weight="400">Relevant saved context</text><rect x="488.8" y="528.8" width="60.0" height="2.4" fill="#698879"/><polygon points="550.0,530.0 539.0,524.0 539.0,536.0" fill="#698879"/><rect x="848.8" y="528.8" width="180.0" height="2.4" fill="#698879"/><polygon points="1030.0,530.0 1019.0,524.0 1019.0,536.0" fill="#698879"/><text x="901" y="515" font-size="16" fill="#29483c" font-weight="400">outcome</text><rect x="1238.8" y="653.8" width="2.4" height="73.0" fill="#698879"/><rect x="343.8" y="726.8" width="895.0" height="2.4" fill="#698879"/><rect x="343.8" y="726.8" width="2.4" height="47.0" fill="#698879"/><polygon points="345.0,775.0 351.0,764.0 339.0,764.0" fill="#698879"/><text x="820" y="715" font-size="17" fill="#29483c" font-weight="400">Call record + request when help is needed</text><rect x="488.8" y="858.8" width="60.0" height="2.4" fill="#698879"/><polygon points="550.0,860.0 539.0,854.0 539.0,866.0" fill="#698879"/><rect x="848.8" y="858.8" width="665.0" height="2.4" fill="#698879"/><rect x="1513.8" y="278.8" width="2.4" height="580.0" fill="#698879"/><rect x="1448.8" y="278.8" width="65.0" height="2.4" fill="#698879"/><polygon points="1450.0,280.0 1461.0,286.0 1461.0,274.0" fill="#698879"/><text x="1005" y="844" font-size="17" fill="#29483c" font-weight="400">Follow-up notes inform the next call</text><rect x="200" y="200" width="290" height="150" rx="14" fill="white" stroke="#d6e0d5"/><text x="222" y="231" font-size="13" fill="#718b75" font-weight="600">01 · SHARE</text><text x="222" y="264" font-size="23" fill="#29483c" font-weight="600">Tell us about home</text><text x="222" y="295" font-size="18" fill="#64796d" font-weight="400">Photos, documents, links</text><text x="222" y="322" font-size="18" fill="#64796d" font-weight="400">and everyday details.</text><rect x="560" y="200" width="290" height="150" rx="14" fill="white" stroke="#d6e0d5"/><text x="582" y="231" font-size="13" fill="#718b75" font-weight="600">02 · CONFIRM</text><text x="582" y="264" font-size="23" fill="#29483c" font-weight="600">Clarify, review, save</text><text x="582" y="295" font-size="18" fill="#64796d" font-weight="400">The assistant asks questions.</text><text x="582" y="322" font-size="18" fill="#64796d" font-weight="400">Family confirms the facts.</text><rect x="1040" y="195" width="400" height="175" rx="14" fill="#285448"/><text x="1065" y="230" font-size="13" fill="#d5e5d0" font-weight="600">SHARED HOUSEHOLD CONTEXT</text><text x="1065" y="268" font-size="25" fill="#fff" font-weight="600">A concrete starting point</text><text x="1065" y="302" font-size="19" fill="#e2eddf" font-weight="400">Approved facts + source notes</text><text x="1065" y="331" font-size="19" fill="#e2eddf" font-weight="400">Family follow-up notes</text><rect x="200" y="455" width="290" height="150" rx="14" fill="white" stroke="#d6e0d5"/><text x="222" y="486" font-size="13" fill="#718b75" font-weight="600">03 · ASK</text><text x="222" y="519" font-size="23" fill="#29483c" font-weight="600">Make a phone call</text><text x="222" y="550" font-size="18" fill="#64796d" font-weight="400">Start with an ordinary</text><text x="222" y="577" font-size="18" fill="#64796d" font-weight="400">question in your own words.</text><rect x="560" y="455" width="290" height="175" rx="14" fill="white" stroke="#d6e0d5"/><text x="582" y="486" font-size="13" fill="#718b75" font-weight="600">04 · GUIDE</text><text x="582" y="519" font-size="23" fill="#29483c" font-weight="600">Work through it</text><text x="582" y="550" font-size="18" fill="#64796d" font-weight="400">Ask about missing details.</text><text x="582" y="577" font-size="18" fill="#64796d" font-weight="400">Give one supported step.</text><text x="582" y="604" font-size="18" fill="#64796d" font-weight="400">Listen to what happened.</text><rect x="1040" y="455" width="400" height="200" rx="14" fill="white" stroke="#d6e0d5"/><text x="1064" y="486" font-size="13" fill="#718b75" font-weight="600">05 · KEEP TRACK</text><text x="1064" y="519" font-size="23" fill="#29483c" font-weight="600">Record what happened</text><rect x="1064" y="538" width="351" height="40" rx="7" fill="#edf4e8"/><rect x="1064" y="587" width="351" height="40" rx="7" fill="#f7eee0"/><text x="1076" y="563" font-size="18" fill="#29483c" font-weight="400">Resolved → save the outcome</text><text x="1076" y="613" font-size="18" fill="#29483c" font-weight="400">Needs help → save a family request</text><rect x="200" y="785" width="290" height="150" rx="14" fill="white" stroke="#d6e0d5"/><text x="222" y="816" font-size="13" fill="#718b75" font-weight="600">06 · UNDERSTAND</text><text x="222" y="849" font-size="23" fill="#29483c" font-weight="600">See what came up</text><text x="222" y="880" font-size="18" fill="#64796d" font-weight="400">Review the call, its outcome</text><text x="222" y="907" font-size="18" fill="#64796d" font-weight="400">and any request for help.</text><rect x="560" y="785" width="290" height="150" rx="14" fill="white" stroke="#d6e0d5"/><text x="582" y="816" font-size="13" fill="#718b75" font-weight="600">07 · FOLLOW THROUGH</text><text x="582" y="849" font-size="23" fill="#29483c" font-weight="600">Pick up the next step</text><text x="582" y="880" font-size="18" fill="#64796d" font-weight="400">Claim the request.</text><text x="582" y="907" font-size="18" fill="#64796d" font-weight="400">Add a response or resolution.</text><text x="48" y="1004" font-size="12" fill="#718b75" font-weight="600">WHAT MAKES THIS WORK</text><text x="48" y="1041" font-size="21" fill="#29483c" font-weight="600">Family web app + OpenAI</text><text x="48" y="1071" font-size="16" fill="#64796d" font-weight="400">Read uploads, ask questions, prepare a handover.</text><text x="605" y="1041" font-size="21" fill="#29483c" font-weight="600">Guava</text><text x="605" y="1071" font-size="16" fill="#64796d" font-weight="400">Live voice conversation and action routing.</text><text x="1080" y="1041" font-size="21" fill="#29483c" font-weight="600">Python + SQLite</text><text x="1080" y="1071" font-size="16" fill="#64796d" font-weight="400">Retrieve context; save facts, calls and follow-ups.</text></g></svg>